{% extends "base.html" %}
{% block title %}Admin sign in – Plate Club{% endblock %}
{% block body %}
<main class="wrap">
  <section class="panel">
    <h2>Admin sign in</h2>
    <form method="post" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="a-pass">Password</label><input id="a-pass" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn">Sign in</button>
    </form>
  </section>
</main>
{% endblock %}
